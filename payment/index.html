<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meptides Secure Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./payment.css?v=20260630c">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <header class="payment-header" aria-label="Meptides payment header">
    <a class="brand" href="https://meptides.com" aria-label="Return to meptides">
      <img class="brand-logo" src="./meptides-logo.svg" alt="meptides." height="34" />
    </a>
    <span class="secure-chip">Secure card payment</span>
  </header>

  <main class="payment-shell">
    <section class="checkout-panel">
      <div class="accent-line" aria-hidden="true"></div>

      <div id="statusBanner" class="status-banner" hidden></div>

      <div class="order-block">
        <h1 id="orderTitle">Preparing payment</h1>
        <p id="orderMeta" class="muted">Validating payment details.</p>
      </div>

      <form id="paymentForm" class="payment-form" hidden>
        <div id="paymentElement" class="payment-element"></div>
        <button id="submitButton" class="pay-button" type="submit">
          <span id="buttonText">Pay now</span>
        </button>
      </form>
    </section>

    <aside class="summary-panel">
      <div class="accent-line" aria-hidden="true"></div>
      <p class="eyebrow"><span class="eyebrow-mark"></span>Summary</p>
      <div class="summary-total">
        <span>Total</span>
        <strong id="summaryTotal">--</strong>
      </div>
      <div id="lineItems" class="line-items"></div>
      <dl id="orderDetails" class="order-details"></dl>
    </aside>
  </main>

  <script type="module" src="./payment.js?v=20260630c"></script>
</body>
</html>
